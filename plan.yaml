phase: 2
name: "Close the capture loop"
description: "Lead + CallAttempt + VoiceNote entities, voice capture UI with platform-assistant shortcut integration, transcription pipeline, downtime-gap detection, batch review UI, screenshot-proximity and manual matching"
duration_weeks: 2

dependencies:
  - "Phase 1 complete: Auth, Advisor profile, RLS-isolated schema, offline-first storage/sync queue, Customer/Visit CRUD"

non_negotiables:
  - "RLS on every table from line 1, keyed to advisor_id"
  - "Job-code regex: ^[A-Z]\\d{3}[A-Z]?$"
  - "Measurement units: cm (not mm)"
  - "HMRC mileage rate: config on Advisor record"
  - "Single Supabase project + source_env flag on every record"
  - "Provenance fields (model_version, prompt_version, confidence) added in Phase 3 ONLY"
  - "Voice capture uses deep-link schema from ADR-001"
  - "Offline-first: Dexie/IndexedDB is local source of truth"
  - "AI runs server-side only in Edge Functions"
  - "Every AI output is a draft/proposal, never complete while offline"
  - "No core action requires two free hands"
  - "Solo-user only, no team features"

entities:
  - name: Lead
    table: leads
    fields:
      - id: uuid (pk, default gen_random_uuid())
      - advisor_id: uuid (fk advisors.id, not null)
      - name: text
      - phone: text
      - landed_at: timestamptz (not null, default now())
      - status: text (not null, check: new|call_attempted|connected|no_response|follow_up_due|converted_to_visit|lost, default: new)
      - contact_attempts_count: integer (not null, default 0)
      - source: text (check: Facebook|Instagram|TikTok|Google|Website|Referral|Leaflet|Show Home|Event|Walk-in|Other)
      - source_env: text (not null, check: demo|qa|live, default: live)
      - created_at: timestamptz (not null, default now())
      - updated_at: timestamptz (not null, default now())
    rls: "advisor_id = auth.uid()"
    indexes:
      - "advisor_id, status"
      - "advisor_id, landed_at desc"
      - "advisor_id, phone"

  - name: CallAttempt
    table: call_attempts
    fields:
      - id: uuid (pk, default gen_random_uuid())
      - lead_id: uuid (fk leads.id, not null)
      - initiated_at: timestamptz (not null, default now())
      - outcome: text (not null, check: connected|no_answer|voicemail)
      - voice_note_id: uuid (fk voice_notes.id, nullable)
      - source_env: text (not null, check: demo|qa|live, default: live)
      - created_at: timestamptz (not null, default now())
    rls: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
    indexes:
      - "lead_id, initiated_at desc"

  - name: VoiceNote
    table: voice_notes
    fields:
      - id: uuid (pk, default gen_random_uuid())
      - advisor_id: uuid (fk advisors.id, not null)
      - audio_path: text (not null)
      - recorded_at: timestamptz (not null, default now())
      - duration_seconds: integer
      - trigger_method: text (not null, check: manual_button|siri_shortcut|assistant_action)
      - status: text (not null, check: recorded|transcribed|unmatched|matched|reviewed, default: recorded)
      - transcript: text
      - extracted_blind_count: integer
      - extracted_parking_notes: text
      - extracted_access_notes: text
      - extracted_name_spoken: text
      - linked_appointment_screenshot_document_id: uuid (fk documents.id, nullable)
      - matched_visit_id: uuid (fk visits.id, nullable)
      - matched_customer_id: uuid (fk customers.id, nullable)
      - match_method: text (check: screenshot_proximity|manual_review|name_hint)
      - lead_id: uuid (fk leads.id, nullable)
      - source_env: text (not null, check: demo|qa|live, default: live)
      - created_at: timestamptz (not null, default now())
      - updated_at: timestamptz (not null, default now())
    rls: "advisor_id = auth.uid()"
    indexes:
      - "advisor_id, status"
      - "advisor_id, recorded_at desc"
      - "advisor_id, lead_id"
      - "matched_visit_id"
      - "linked_appointment_screenshot_document_id"

migrations:
  - name: "20260807_phase2_entities"
    description: "Create leads, call_attempts, voice_notes tables with RLS"
    tables: [leads, call_attempts, voice_notes]
    rls_policies:
      - table: leads
        policies:
          - name: "leads_select_own"
            command: SELECT
            using: "advisor_id = auth.uid()"
          - name: "leads_insert_own"
            command: INSERT
            with_check: "advisor_id = auth.uid()"
          - name: "leads_update_own"
            command: UPDATE
            using: "advisor_id = auth.uid()"
            with_check: "advisor_id = auth.uid()"
          - name: "leads_delete_own"
            command: DELETE
            using: "advisor_id = auth.uid()"
      - table: call_attempts
        policies:
          - name: "call_attempts_select_own"
            command: SELECT
            using: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
          - name: "call_attempts_insert_own"
            command: INSERT
            with_check: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
          - name: "call_attempts_update_own"
            command: UPDATE
            using: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
            with_check: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
          - name: "call_attempts_delete_own"
            command: DELETE
            using: "lead_id IN (SELECT id FROM leads WHERE advisor_id = auth.uid())"
      - table: voice_notes
        policies:
          - name: "voice_notes_select_own"
            command: SELECT
            using: "advisor_id = auth.uid()"
          - name: "voice_notes_insert_own"
            command: INSERT
            with_check: "advisor_id = auth.uid()"
          - name: "voice_notes_update_own"
            command: UPDATE
            using: "advisor_id = auth.uid()"
            with_check: "advisor_id = auth.uid()"
          - name: "voice_notes_delete_own"
            command: DELETE
            using: "advisor_id = auth.uid()"

edge_functions:
  - name: transcribe-voice-note
    description: "Transcribes audio to text and extracts structured fields (blind count, parking, access, name)"
    trigger: "VoiceNote record created/updated with status=recorded and audio uploaded to Storage"
    input:
      voice_note_id: uuid
      audio_path: text (Storage path)
    output:
      transcript: text
      extracted_blind_count: integer
      extracted_parking_notes: text
      extracted_access_notes: text
      extracted_name_spoken: text
      confidence: number (0-1)
    behavior:
      - "Runs server-side only, no client API keys"
      - "Updates VoiceNote with transcript, extracted fields, status=transcribed"
      - "Queues honestly when offline - never claims complete while offline"
      - "Uses Claude API for transcription + extraction"

dexie_schema:
  - table: leads
    fields: [id, advisor_id, name, phone, landed_at, status, contact_attempts_count, source, source_env, created_at, updated_at, _sync_status, _last_synced_at]
    indexes: [advisor_id+status, advisor_id+landed_at, advisor_id+phone]
  - table: call_attempts
    fields: [id, lead_id, initiated_at, outcome, voice_note_id, source_env, created_at, _sync_status, _last_synced_at]
    indexes: [lead_id+initiated_at]
  - table: voice_notes
    fields: [id, advisor_id, audio_path, recorded_at, duration_seconds, trigger_method, status, transcript, extracted_blind_count, extracted_parking_notes, extracted_access_notes, extracted_name_spoken, linked_appointment_screenshot_document_id, matched_visit_id, matched_customer_id, match_method, lead_id, source_env, created_at, updated_at, _sync_status, _last_synced_at]
    indexes: [advisor_id+status, advisor_id+recorded_at, advisor_id+lead_id, matched_visit_id, linked_appointment_screenshot_document_id]

sync_queue:
  - entity: leads
    operations: [create, update, delete]
  - entity: call_attempts
    operations: [create, update, delete]
  - entity: voice_notes
    operations: [create, update, delete]

ui_components:
  - name: LeadList
    description: "List of leads with status badges, filterable by status, sortable by landed_at"
    features:
      - "Pull-to-refresh triggers sync"
      - "Swipe actions: call, record voice note, mark status"
      - "Offline indicator per lead"
  - name: LeadDetail
    description: "Lead details, call history, voice notes, actions"
    features:
      - "Prominent 'Call' button initiates CallAttempt"
      - "Prominent 'Record Voice Note' button (manual_button trigger)"
      - "Shows CallAttempt history with outcomes"
      - "Shows linked VoiceNotes with status"
      - "Screenshot proximity matching UI"
  - name: VoiceCaptureScreen
    description: "Full-screen voice recording UI, launched via deep-link or manual button"
    features:
      - "Starts recording immediately on deep-link (beelo://voice-capture)"
      - "Large stop button, single-control"
      - "Shows recording duration"
      - "Works offline - saves to Dexie immediately"
      - "Uploads audio to Storage when online"
      - "Handles trigger_method from deep-link params"
  - name: BatchReviewScreen
    description: "Downtime-triggered review session for unmatched captures"
    features:
      - "Triggered by schedule gap detection + backlog of unmatched VoiceNotes"
      - "Shows VoiceNotes with status=unmatched or transcribed"
      - "Screenshot proximity matching: shows appointment card screenshots near recording time"
      - "Manual matching: pick Visit or Customer from list"
      - "Name-hint matching: extracted_name_spoken vs Customer.display_name"
      - "Updates VoiceNote with matched_visit_id, matched_customer_id, match_method, status=matched"
      - "Lead conversion: matched Lead -> converted_to_visit"
  - name: DowntimeDetector
    description: "Background service detecting schedule gaps for batch review prompts"
    features:
      - "Monitors Visit schedule for gaps >= 30 minutes"
      - "Checks for backlog: VoiceNotes with status in [recorded, transcribed, unmatched] count > 0"
      - "Prompts non-intrusive banner: 'You have 15 min before next job - review 3 voice notes?'"
      - "Respects offline state - only prompts when online for matching"

platform_integrations:
  - name: iOS Siri Shortcuts
    setup: "In-app guide with one-tap shortcut installation"
    deep_link: "beelo://voice-capture?trigger=siri_shortcut&source_env={env}"
    user_phrase: "Hey Siri, log call"
    optional_params: "lead_id (from share sheet)"
  - name: Android App Actions
    setup: "actions.xml with START_RECORDING intent"
    deep_link: "beelo://voice-capture?trigger=google_assistant&source_env={env}"
    user_phrase: "OK Google, note job on Beelo"

offline_behavior:
  - "Voice recording works fully offline - audio saved to local filesystem, VoiceNote created in Dexie with status=recorded"
  - "Transcription queues when offline - VoiceNote shows 'queued for transcription' honestly"
  - "Batch review works offline for manual matching (no screenshot proximity without network)"
  - "Sync queue processes VoiceNotes, Leads, CallAttempts when back online"
  - "No AI output claimed complete while offline"

validation_rules:
  - "VoiceNote.duration_seconds <= 300 (5 min max)"
  - "VoiceNote.trigger_method must be one of: manual_button, siri_shortcut, assistant_action"
  - "VoiceNote.status transitions: recorded -> transcribed -> unmatched -> matched -> reviewed"
  - "Lead.status transitions per workflow"
  - "CallAttempt.outcome must be one of: connected, no_answer, voicemail"
  - "All entities require advisor_id and source_env"

testing_checklist:
  - "Create Lead -> Call -> VoiceNote via manual button -> verify offline persistence"
  - "Deep-link voice capture (simulated) -> verify VoiceNote created with correct trigger_method"
  - "Offline recording -> online -> transcription runs -> VoiceNote updated with transcript/extracted fields"
  - "Downtime gap with backlog -> batch review prompt appears"
  - "Screenshot proximity matching -> VoiceNote matched to Visit"
  - "Manual matching -> VoiceNote matched to Visit/Customer"
  - "Name-hint matching -> VoiceNote matched to Customer"
  - "Lead conversion from matched VoiceNote -> Lead.status = converted_to_visit"
  - "RLS: verify advisor cannot see other advisor's leads/voice_notes"
  - "Sync queue: offline edits sync when online"

file_structure:
  supabase/
    migrations/
      20260807_phase2_entities.sql
    functions/
      transcribe-voice-note/
        index.ts
        deno.json
  src/
    db/
      schema.ts (Dexie schema additions)
      syncQueue.ts (sync queue additions)
    features/
      leads/
        components/
          LeadList.tsx
          LeadDetail.tsx
          LeadForm.tsx
        hooks/
          useLeads.ts
          useLeadActions.ts
      voice/
        components/
          VoiceCaptureScreen.tsx
          VoiceNoteCard.tsx
          BatchReviewScreen.tsx
          ScreenshotMatcher.tsx
          ManualMatcher.tsx
          NameHintMatcher.tsx
        hooks/
          useVoiceCapture.ts
          useTranscription.ts
          useBatchReview.ts
        utils/
          deepLinkHandler.ts
          audioRecorder.ts
      downtime/
        hooks/
          useDowntimeDetector.ts
        components/
          DowntimePrompt.tsx
    platform/
      ios/
        SiriShortcutGuide.tsx
      android/
        AppActionsGuide.tsx
    types/
      lead.ts
      voiceNote.ts
      callAttempt.ts

handoff_criteria:
  - "All 3 entities created in Supabase with RLS from line 1"
  - "Dexie schema matches Supabase schema for all 3 entities"
  - "Voice capture works via deep-link and manual button, offline-first"
  - "Transcription Edge Function runs server-side, updates VoiceNote honestly"
  - "Downtime detection prompts batch review during schedule gaps"
  - "Batch review UI supports screenshot proximity, manual, and name-hint matching"
  - "Lead conversion flow works from matched VoiceNote"
  - "Sync queue processes all 3 entity types"
  - "iOS Siri Shortcut and Android App Action setup guides included"
  - "Lint, typecheck, unit tests pass"
  - "Manual test checklist completable in 3 items, <5 min each"