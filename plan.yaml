# ──────────────────────────────────────────────────────────────
# 5. KEY IMPLEMENTATION TASKS
# ──────────────────────────────────────────────────────────────
tasks:
  - id: "1.1"
    name: "Project scaffolding + Vite + TypeScript + PWA config"
    details: |
      - Initialize Vite React TS project
      - Configure Workbox PWA plugin (offline shell, cache-first for assets)
      - Set up ESLint + Prettier + Vitest
      - Add path aliases (@/src, @/components, etc.)

  - id: "1.2"
    name: "Supabase project setup + Auth configuration"
    details: |
      - Create Supabase project (local via CLI for dev)
      - Enable email/password + magic link auth
      - Configure auth redirect URLs (localhost, preview, production)
      - Set up Supabase client in src/lib/supabase.ts

  - id: "1.3"
    name: "Run all migrations (RLS from line 1)"
    details: |
      - Apply 6 migrations in order via Supabase CLI
      - Verify RLS policies on every table
      - Generate TypeScript types: `supabase gen types typescript --local > src/types/database.ts`

  - id: "1.4"
    name: "Dexie offline DB + sync queue implementation"
    details: |
      - Define Dexie schema matching all tables (src/lib/dexie.ts)
      - Implement sync queue table with status: pending | syncing | synced | failed
      - Write sync processor: batches pending ops, pushes to Supabase, handles conflicts (last-write-wins + diff for financial fields)
      - Add online/offline detection hook (navigator.onLine + window events)
      - Expose sync status via React context

  - id: "1.5"
    name: "Auth flow + Advisor profile CRUD"
    details: |
      - Login page (email/password + magic link)
      - Session persistence + auto-refresh
      - On first sign-in: create advisor record (auth_user_id link)
      - Profile page: edit business_name, employment_model, commission_rate_percent, vat_adjustment_percent, tax_reserve_percent, full_job_minutes_per_blind, weekly_earnings_target, HMRC mileage rates (tier1, tier2, threshold)
      - Validation: percentages 0-100, rates > 0, job_code regex on visits

  - id: "1.6"
    name: "Customer CRUD + list"
    details: |
      - Customer list page (searchable, sortable, pull-to-refresh)
      - Create/edit form: customer_number (unique per advisor), phone, postcode, address, display_name, contact_preferences
      - Customer detail page with visit history
      - All writes go through Dexie → sync queue

  - id: "1.7"
    name: "Visit CRUD + outcome taxonomy"
    details: |
      - Visit list page (filter by date, status, outcome)
      - Create/edit form: all Visit fields per schema
      - job_code validation: regex ^[A-Z]\d{3}[A-Z]?$
      - outcome dropdown: 12 validated values from taxonomy
      - appointment_type: sales | survey | fit | service_call
      - job_source: self_sold | company_assigned
      - estimated_duration_minutes = blind_count × full_job_minutes_per_blind (advisor config)
      - Measurement units: cm (enforced in MeasurementCheck later, but Visit stores blind_count only)

  - id: "1.8"
    name: "Mobile-first navigation + PWA shell"
    details: |
      - Bottom tab bar: Home, Visits, Customers, Profile
      - Header with source_env badge (demo/qa/live) + sync status indicator
      - Responsive layout (mobile-first, works on desktop)
      - Workbox service worker registration + update flow
      - Install prompt handling

  - id: "1.9"
    name: "Sync status UI + offline indicator"
    details: |
      - Persistent sync badge in header (synced | pending N | offline)
      - Sync queue panel (accessible from header): list pending operations, retry failed
      - Honest offline messaging: "Queued — will sync when online"

  - id: "1.10"
    name: "Validation library (Zod schemas)"
    details: |
      - Job code regex: ^[A-Z]\d{3}[A-Z]?$
      - Money: positive, 2 decimal places
      - Percentages: 0-100
      - HMRC rates: positive numbers
      - Reusable schemas in src/lib/validation.ts

  - id: "1.11"
    name: "Unit tests (Vitest)"
    details: |
      - Validation schemas
      - Dexie CRUD operations (mocked)
      - Sync queue logic
      - Auth helpers
      - Target: >80% coverage on lib/ and hooks/

  - id: "1.12"
    name: "Manual test checklist execution"
    details: |
      1. Offline: airplane mode → create customer + visit → verify local persistence → online → verify sync
      2. Auth: sign up → complete profile → sign out → sign in → profile persists
      3. RLS: create two advisor accounts → verify data isolation in Supabase dashboard

# ──────────────────────────────────────────────────────────────
# 6. NON-NEGOTIABLES CHECKLIST (Phase 1)
# ──────────────────────────────────────────────────────────────
non_negotiables:
  - "All tables have RLS policies keyed to advisor_id via auth.uid()"
  - "Job code validation uses regex ^[A-Z]\\d{3}[A-Z]?$"
  - "Measurement units documented as cm (not mm) in schemas"
  - "HMRC mileage rates stored on Advisor record (config, not hardcoded)"
  - "source_env flag on every record + visible UI badge"
  - "No AI code, no provenance fields (model_version, prompt_version, confidence)"
  - "Dexie is local source of truth; all writes go through sync queue"
  - "Offline capture works; UI never blocks on network"
  - "Sync queue visible with honest pending state"
  - "Single Supabase project (local dev + preview + prod via source_env)"

# ──────────────────────────────────────────────────────────────
# 7. JUDGMENT CALLS (Documented for multi-agent consistency)
# ──────────────────────────────────────────────────────────────
judgment_calls:
  - decision: "Create all entity tables in Phase 1 (not just Customer/Visit)"
    rationale: |
      PROJECT_SETUP_PLAN.md §5 says "RLS-isolated schema for ALL entities" in Phase 1.
      Creating schemas now avoids migration churn later. Phase 2-5 only add UI/logic.
      Tables without UI remain empty until their phase.
  - decision: "No provenance fields on Document table in Phase 1"
    rationale: |
      Architect.md §13 and PROJECT_SETUP_PLAN.md §5 explicitly state: "No AI, no provenance fields" for Phase 1.
      Provenance fields (model_version, prompt_version, confidence) added in Phase 3 migration.
  - decision: "Visit.estimated_duration_minutes computed client-side from advisor config"
    rationale: |
      BusinessRules.md §55-56: full_job_minutes_per_blind is advisor-configurable (~33 min default).
      Computed on visit create/edit, stored for schedule-risk checks in Phase 4.
  - decision: "MeasurementCheck table uses cm with NUMERIC(6,2) precision"
    rationale: |
      BusinessRules.md §45: units are centimetres, default tolerance 1cm.
      Working width/drop = minimum of three readings (not average).
  - decision: "Sync queue is Dexie-only, not synced to Supabase"
    rationale: |
      PROJECT_SETUP_PLAN.md §4: "sync_queue table (Dexie-only, not synced to Supabase)".
      Keeps sync metadata local; no RLS needed.

# ──────────────────────────────────────────────────────────────
# 8. HANDOFF TO BUILDER
# ──────────────────────────────────────────────────────────────
handoff:
  start_with: "Task 1.1 (scaffolding)"
  dependencies_ready: true
  supabase_local: "Run `supabase start` then `supabase db push` for migrations"
  env_vars_needed:
    - VITE_SUPABASE_URL
    - VITE_SUPABASE_ANON_KEY
  test_command: "npm run test"
  lint_command: "npm run lint"
  typecheck_command: "npm run typecheck"
  dev_command: "npm run dev"