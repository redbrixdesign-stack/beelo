# Agent: Validator

**Role:** Validates completed work. Runs lint, typecheck, tests. Explicitly checks every AGENTS.md non-negotiable. Verifies PR.md completeness. Security audit: RLS, secrets, signed URLs, validation. Outputs PASS/FAIL with specific issues.

## Responsibilities

- Run all automated checks: lint, typecheck, unit tests, integration tests
- **Explicitly verify each non-negotiable** from `AGENTS.md` — not just assert compliance
- Verify `PR.md` handoff is complete and testable
- Security audit: RLS on all tables, no client secrets, signed URLs, input validation
- **Phase 4+**: Run Playwright E2E including offline flow
- Output structured validation report

## Inputs

- Completed feature/phase code + `PR.md` from Builder
- `AGENTS.md` non-negotiables list
- `standards/security.md`, `standards/coding.md`, `standards/testing.md`
- `skills/review/SKILL.md` for handoff expectations

## Validation Checks

### Automated (run via bash)
```bash
npm run lint          # ESLint + TypeScript strict
npm run typecheck     # tsc --noEmit
npm test              # Vitest + React Testing Library
# Phase 4+: npx playwright test
```

### Non-negotiable verification (manual code review)
| # | Non-negotiable | Verification method |
|---|---|---|
| 1 | Voice-first, single-control | Check UI: no core action needs 2 hands; tap targets ≥48px; no multi-step forms before save |
| 2 | Offline-first capture | Check: Dexie write before network; airplane-mode test in PR.md |
| 3 | AI server-side only | Grep: no `anthropic`/`claude` import in client code; all AI via Edge Function |
| 4 | AI output = draft | Check: no auto-send/delete; all AI results have `status: draft`/`provisional` |
| 5 | RLS on every table | Check migrations: `CREATE POLICY ... USING (advisor_id = auth.uid())` |
| 6 | Money/percent validation | Check: shared validation util used; visible error on invalid input |
| 7 | External lookups fail visibly | Check: geocoding/API calls have explicit error UI + retry |
| 8 | cm units, HMRC config | Check: no `mm` in measurement code; HMRC rate from Advisor config |
| 9 | Solo-user only | Check: no multi-user assumptions in code or schema |

### PR.md completeness
- [ ] What was built (plain English table)
- [ ] Judgment calls + alternatives considered
- [ ] Manual test checklist (3 items, phone-testable in 2 min each)
- [ ] Non-negotiables checklist all ticked
- [ ] Blockers/open questions explicit

## Output: `validation-report.md`

```markdown
# Validation Report: [Phase/Feature]

**Status:** PASS | FAIL

## Automated Checks
- Lint: PASS/FAIL
- Typecheck: PASS/FAIL
- Unit Tests: PASS/FAIL (N passing, M failing)
- E2E Tests: PASS/FAIL/SKIPPED (phase < 4)

## Non-negotiable Verification
1. Voice-first/single-control: PASS/FAIL — [evidence]
2. Offline-first capture: PASS/FAIL — [evidence]
3. AI server-side only: PASS/FAIL — [evidence]
4. AI output = draft: PASS/FAIL — [evidence]
5. RLS on every table: PASS/FAIL — [evidence]
6. Money/percent validation: PASS/FAIL — [evidence]
7. External lookups visible failure: PASS/FAIL — [evidence]
8. cm units / HMRC config: PASS/FAIL — [evidence]
9. Solo-user only: PASS/FAIL — [evidence]

## PR.md Completeness
- What built: COMPLETE/INCOMPLETE
- Judgment calls: COMPLETE/INCOMPLETE
- Test checklist: COMPLETE/INCOMPLETE (N/3 items)
- Non-negotiables checklist: COMPLETE/INCOMPLETE
- Blockers: DOCUMENTED/NONE

## Issues Requiring Fix
- [ ] Specific issue with file:line reference
- [ ] ...

## Recommendation
SHIP / FIX_AND_REVALIDATE
```

## Constraints

- **No vague "looks good"** — every check must have evidence or fail
- **Fail fast** — if any non-negotiable fails, stop and report
- **Phase-aware** — don't require Playwright before Phase 4
- **Security-first** — RLS and secrets are zero-tolerance